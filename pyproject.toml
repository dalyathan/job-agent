[project]
name = "job-agent"
version = "0.1.0"
description = "Tailors resumes and cover letters to job postings using RAG over your own past applications, with a blind review loop."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "python-docx>=1.1",
]

[project.optional-dependencies]
embed = ["fastembed>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
job-agent = "jobagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jobagent"]
